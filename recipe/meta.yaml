{% set name = "pyjuliacall" %}
{% set pypi_name = "juliacall" %}
{% set version = "0.9.36" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ pypi_name[0] }}/{{ pypi_name }}/juliacall-{{ version }}.tar.gz
  sha256: 75abfe60fffc48161f5b4b3619ee0e2299df75c738aa88da4302ec718c6c9c7d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1
  string: py{{ python_min | replace('.', '') }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}

requirements:
  host:
    - python {{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    # PythonCall loads Python's shared library, which conda-forge ships separately as
    # libpython from 3.15 on. libpython only exists for 3.11+, so 3.10 gets its own build.
    {% if python_min == "3.10" %}
    - python <3.11
    {% else %}
    - libpython
    {% endif %}
    - pyjuliapkg >=0.1.17,<0.2.dev0

test:
  imports:
    - juliacall
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://github.com/JuliaPy/PythonCall.jl
  summary: Julia and Python in seamless harmony
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MilesCranmer
    - mkitti
